<div class="auth-container">
  <div class="auth-card">
    <h2>EkubCircle</h2>
    <p class="subtitle">Register as an Organizer</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="fullName">Full Name (Username)</label>
        <input id="fullName" type="text" placeholder="e.g. Abebe Kebede" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="abebe@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••" required />
      </div>

      <button type="submit" class="btn btn-primary">Register Organizer</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
